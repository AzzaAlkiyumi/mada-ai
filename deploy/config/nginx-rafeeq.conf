# Rafeeq site. Installed by setup-server.sh, which replaces __DOMAIN__ and
# __PHP_VERSION__. Certbot later adds the HTTPS (443) parts to this file.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # The built React app.
    root /var/www/rafeeq/frontend;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # API and Sanctum go to Laravel.
    location ~ ^/(api|sanctum)(/|$) {
        root /var/www/rafeeq/backend/public;
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        internal;
        root /var/www/rafeeq/backend/public;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm.sock;

        # Chat replies are streamed (server-sent events): send each chunk at once.
        fastcgi_buffering off;
        gzip off;
        fastcgi_read_timeout 330s;
    }

    # Hashed build files never change, so they can be cached for long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other path is a page of the React app.
    location / {
        try_files $uri /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
